<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gatrion games</title>
    <meta name="description" content="Wordle dua bahasa dan idle tambang. Dua game browser kecil untuk mengisi jeda kerja." />
    <meta name="theme-color" content="#f6f4ec" />
    <script>
      // terapkan tema tersimpan sebelum paint supaya tidak berkedip
      try {
        if (localStorage.getItem("gatrion.theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0b0c09");
        }
      } catch (error) {
        /* mode privat: pakai tema terang */
      }
    </script>
